version: "3.8"

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: itom_backend
    restart: always
    ports:
      - "9000:8000"
    volumes:
      - ./itom_data:/app/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: itom_frontend
    restart: always
    ports:
      - "8081:80"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Shanghai
    depends_on:
      - backend
